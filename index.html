<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Commandes</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card: #fff; --accent: #ff6b6b; --primary: #333; }
        [data-theme="dark"] { --bg: #121212; --text: #eee; --card: #1e1e1e; }
        
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        .container { padding: 15px; }
        .card { background: var(--card); padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }
        .card.selected { border-color: blue; background: #e3f2fd; }
        
        /* Menu déroulant */
        .menu-overlay { position: fixed; bottom: 60px; right: 10px; background: #fff; border: 1px solid #ccc; display: none; padding: 10px; border-radius: 8px; z-index: 1000; }
        .bottom-bar { position: fixed; bottom: 0; width: 100%; background: #eee; display: flex; justify-content: space-around; padding: 15px; }
        
        #addition { border-top: 2px solid #ccc; margin-top: 20px; }
        .total-price { font-weight: bold; font-size: 1.2em; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Catalogue</h2>
    <div id="catalog"></div>

    <h2 id="addition-title">Addition</h2>
    <div id="addition"></div>
    <div class="total-price" id="totalDisplay">PRIX : 0 €</div>
    <button onclick="clearOrder()">Finaliser la commande</button>
</div>

<!-- Menu flottant -->
<div class="menu-overlay" id="menuOverlay">
    <button onclick="openModal('dish')">Ajouter Plat</button><br>
    <button onclick="openModal('menu')">Ajouter Menu</button><br>
    <button onclick="toggleTheme()">Mode Sombre/Clair</button>
</div>

<div class="bottom-bar">
    <button onclick="toggleMenu()">☰ Menu</button>
    <button onclick="window.scrollTo(0, document.body.scrollHeight)">Addition</button>
</div>

<script>
    let catalog = JSON.parse(localStorage.getItem('catalog')) || [];
    let order = JSON.parse(localStorage.getItem('order')) || [];

    function render() {
        const catDiv = document.getElementById('catalog');
        catDiv.innerHTML = '';
        catalog.forEach((item, index) => {
            catDiv.innerHTML += `<div class="card" onclick="addToOrder(${index})">
                <strong>${item.name}</strong> (${item.type})<br>
                ${item.price} €</div>`;
        });
        
        const addDiv = document.getElementById('addition');
        addDiv.innerHTML = '';
        let total = 0;
        order.forEach((item, index) => {
            total += parseFloat(item.price);
            addDiv.innerHTML += `<div class="card selected" onclick="removeFromOrder(${index})">${item.name} - ${item.price} €</div>`;
        });
        document.getElementById('totalDisplay').innerText = "PRIX : " + total + " €";
        localStorage.setItem('catalog', JSON.stringify(catalog));
        localStorage.setItem('order', JSON.stringify(order));
    }

    function addToOrder(index) { order.push(catalog[index]); render(); }
    function removeFromOrder(index) { order.splice(index, 1); render(); }
    function clearOrder() { order = []; render(); alert("Commande finalisée !"); }
    function toggleMenu() { document.getElementById('menuOverlay').style.display = (document.getElementById('menuOverlay').style.display === 'block') ? 'none' : 'block'; }
    function toggleTheme() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

    // Fonctions simplifiées pour ajouter (à étendre avec des formulaires prompt ou modaux)
    function openModal(type) {
        const name = prompt("Nom :");
        const price = prompt("Prix en euros :");
        const cat = prompt("Type (Dessert, Boisson, etc.) :");
        if(name && price) {
            catalog.push({name, price, type: cat || "Autre"});
            render();
        }
    }
    
    render();
</script>
</body>
</html>
