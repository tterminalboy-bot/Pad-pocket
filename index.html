<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Commandes</title>
    <style>
        :root { --bg: #f4f4f9; --card: #fff; --border: #333; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
        
        /* Grille des catégories */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; flex-grow: 1; }
        .box { border: 3px solid var(--border); padding: 20px; text-align: center; font-weight: bold; cursor: pointer; border-radius: 10px; }
        
        /* Barre du bas */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; border-top: 3px solid var(--border); display: flex; background: var(--bg); }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; border-right: 2px solid var(--border); cursor: pointer; }
        .nav-item:last-child { border-right: none; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="box" onclick="showCategory('plats')">les plats</div>
        <div class="box"></div> <!-- Vide pour le design -->
        <div class="box" onclick="showCategory('dessert')">dessert</div>
        <div class="box"></div>
        <div class="box" onclick="showCategory('apéro')">apéritif</div>
        <div class="box"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="toggleMenu()">☰</div>
        <div class="nav-item" onclick="goToAddition()">détails de la commande</div>
    </div>

    <script>
        function showCategory(cat) { alert("Affichage de la catégorie : " + cat); }
        function toggleMenu() { alert("Ouverture du menu (Ajouter plat, taille texte, etc.)"); }
        function goToAddition() { alert("Ouverture de l'addition"); }
    </script>
</body>
</html>
