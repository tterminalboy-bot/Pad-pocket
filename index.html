<!DOCTYPE html>
<html lang="fr" data-theme="light" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Commandes</title>
    <style>
        :root {
            --bg-color: #f7f7f9;
            --text-color: #222222;
            --card-bg: #ffffff;
            --border-color: #222222;
            --primary: #ff4757;
            --selected-border: #0056b3;
            --font-size: 16px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f7f7f9;
            --card-bg: #1e1e1e;
            --border-color: #ffffff;
            --primary: #ff6b81;
            --selected-border: #63b3ed;
        }

        [data-font-size="small"] { --font-size: 14px; }
        [data-font-size="medium"] { --font-size: 16px; }
        [data-font-size="large"] { --font-size: 19px; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            height: 100%;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .category-box, .item-card {
            border: 3px solid var(--border-color);
            border-radius: 12px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Animation d'enfoncement au clic */
        .category-box:active, .item-card:active {
            transform: scale(0.95);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Mode Suppression actif : bordure rouge clignotante ou spécifique */
        body.delete-mode .category-box, 
        body.delete-mode .item-card {
            border-color: #ff4757 !important;
            animation: pulse-delete 1s infinite alternate;
        }

        @keyframes pulse-delete {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .item-card.selected {
            border-color: var(--selected-border);
            box-shadow: inset 0 0 0 3px var(--selected-border), 0 4px 6px rgba(0,0,0,0.1);
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: var(--card-bg);
            border-top: 3px solid var(--border-color);
            display: flex;
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 2px solid var(--border-color);
            font-size: 1.1em;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .nav-btn:last-child {
            border-right: none;
        }

        .hamburger-icon {
            font-size: 1.6em;
            line-height: 1;
        }

        .overlay-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 99;
        }
        .overlay-backdrop.open {
            display: block;
        }

        .overlay-menu {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            max-height: 80%;
            background-color: var(--card-bg);
            color: var(--text-color);
            border-top: 3px solid var(--border-color);
            border-radius: 20px 20px 0 0;
            transition: bottom 0.3s ease-in-out;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .overlay-menu.open {
            bottom: 0;
        }

        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: 2px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 0.85em;
        }

        .form-group input, .form-group select {
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95em;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: 2px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn-delete-mode {
            background-color: #e74c3c !important;
            color: white !important;
        }

        .section-title {
            margin: 12px 0 8px 0;
            font-size: 1em;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            font-weight: bold;
        }

        .addition-total {
            margin-top: 20px;
            padding: 15px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            text-align: right;
        }

        .addition-total span {
            font-size: 1.3em;
            font-weight: bold;
        }

        .delete-banner {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        body.delete-mode .delete-banner {
            display: block;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    
    <div class="main-content" id="mainContent"></div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="toggleOverlay()">
            <span class="hamburger-icon">☰</span>
            <span>Menu</span>
        </button>
        <button class="nav-btn" onclick="showAddition()">
            <span>Détails de la commande</span>
        </button>
    </div>

    <div class="overlay-backdrop" id="overlayBackdrop" onclick="toggleOverlay()"></div>

    <div class="overlay-menu" id="overlayMenu">
        <div class="overlay-header">
            <h2>Paramètres & Gestion</h2>
            <button class="close-btn" onclick="toggleOverlay()">Fermer</button>
        </div>

        <div class="form-group">
            <label>Affichage & Outils</label>
            <button class="btn-action" style="background:var(--card-bg); color:var(--text-color);" onclick="toggleTheme()">Changer Sombre / Clair</button>
            <button class="btn-action" style="background:var(--card-bg); color:var(--text-color);" onclick="changeFontSize()">Changer la taille du texte</button>
            <button class="btn-action btn-delete-mode" id="deleteModeBtn" onclick="toggleDeleteMode()">Activer le mode Suppression (Double-clic)</button>
        </div>

        <div class="section-title">Ajouter une catégorie</div>
        <div class="form-group">
            <label>Nom de la catégorie</label>
            <input type="text" id="newCatName" placeholder="Ex: Entrées, Plats...">
        </div>
        <div class="form-group">
            <label>Couleur de fond</label>
            <input type="color" id="newCatColor" value="#ffffff">
        </div>
        <button class="btn-action" onclick="addCategory()">Créer la catégorie</button>

        <div class="section-title">Ajouter un plat</div>
        <div class="form-group">
            <label>Nom du plat</label>
            <input type="text" id="newDishName" placeholder="Nom du plat">
        </div>
        <div class="form-group">
            <label>Prix en euros</label>
            <input type="number" id="newDishPrice" placeholder="Prix">
        </div>
        <div class="form-group">
            <label>Couleur de fond du plat</label>
            <input type="color" id="newDishColor" value="#ffffff">
        </div>
        <div class="form-group">
            <label>Catégorie</label>
            <select id="newDishCategory">
                <!-- Dynamique -->
            </select>
        </div>
        <button class="btn-action" onclick="addDish()">Ajouter le plat</button>
    </div>

</div>

<script>
    let categories = JSON.parse(localStorage.getItem('app_categories')) || [];
    let dishes = JSON.parse(localStorage.getItem('app_dishes')) || [];
    let order = JSON.parse(localStorage.getItem('app_order')) || [];
    let currentView = 'home';
    let isDeleteMode = false;

    function saveData() {
        localStorage.setItem('app_categories', JSON.stringify(categories));
        localStorage.setItem('app_dishes', JSON.stringify(dishes));
        localStorage.setItem('app_order', JSON.stringify(order));
    }

    function getContrastColor(hexcolor) {
        if (!hexcolor) return '#000000';
        const cleanHex = hexcolor.replace('#', '');
        const r = parseInt(cleanHex.substr(0, 2), 16);
        const g = parseInt(cleanHex.substr(2, 2), 16);
        const b = parseInt(cleanHex.substr(4, 2), 16);
        const yiq = (r * 299 + g * 587 + b * 114) / 1000;
        return yiq >= 128 ? '#000000' : '#ffffff';
    }

    function toggleDeleteMode() {
        isDeleteMode = !isDeleteMode;
        const btn = document.getElementById('deleteModeBtn');
        if (isDeleteMode) {
            document.body.classList.add('delete-mode');
            btn.textContent = 'Désactiver le mode Suppression';
            btn.style.backgroundColor = '#c0392b';
        } else {
            document.body.classList.remove('delete-mode');
            btn.textContent = 'Activer le mode Suppression (Double-clic)';
            btn.style.backgroundColor = '#e74c3c';
        }
        toggleOverlay();
        render();
    }

    function handleElementClick(type, id) {
        if (isDeleteMode) {
            // Ne fait rien au clic simple en mode suppression, on attend le double-clic
            return;
        }
        
        if (type === 'category') {
            openCategory(id);
        } else if (type === 'dish') {
            // Ajout direct avec animation d'enfoncement gérée par le CSS :active, puis retour accueil
            const dish = dishes.find(d => d.id === id);
            if (dish) {
                order.push(dish);
                saveData();
                setTimeout(() => {
                    goHome();
                }, 150); // Petit délai pour laisser voir l'effet visuel d'enfoncement
            }
        } else if (type === 'order_item') {
            // Dans l'addition, cliquer permet de retirer le plat
            const index = order.findIndex(o => o.id === id);
            if (index > -1) {
                order.splice(index, 1);
                saveData();
                render();
            }
        }
    }

    function handleElementDoubleClick(type, id) {
        if (!isDeleteMode) return;

        if (type === 'category') {
            const cat = categories.find(c => c.id === id);
            if (cat && confirm(`Voulez-vous vraiment supprimer la catégorie "${cat.name}" et tous ses plats associés ?`)) {
                categories = categories.filter(c => c.id !== id);
                dishes = dishes.filter(d => d.category !== id);
                saveData();
                render();
            }
        } else if (type === 'dish') {
            const dish = dishes.find(d => d.id === id);
            if (dish && confirm(`Voulez-vous vraiment supprimer le plat "${dish.name}" ?`)) {
                dishes = dishes.filter(d => d.id !== id);
                order = order.filter(o => o.id !== id);
                saveData();
                render();
            }
        }
    }

    function render() {
        updateCategorySelect();
        const content = document.getElementById('mainContent');
        content.innerHTML = '';

        let bannerHtml = `<div class="delete-banner">⚠️ MODE SUPPRESSION ACTIF : Double-cliquez sur un élément pour le supprimer.</div>`;

        if (currentView === 'home') {
            let html = bannerHtml;
            if (categories.length === 0) {
                html += `<p style="text-align:center; margin-top:40px;">Aucune catégorie pour le moment.<br>Ouvrez le menu ☰ en bas pour en créer une !</p>`;
            } else {
                html += '<div class="grid-container">';
                categories.forEach(cat => {
                    const textColor = getContrastColor(cat.color);
                    html += `<div class="category-box" style="background-color: ${cat.color}; color: ${textColor};" 
                        onclick="handleElementClick('category', '${cat.id}')" 
                        ondblclick="handleElementDoubleClick('category', '${cat.id}')">
                        ${cat.name}
                    </div>`;
                });
                html += '</div>';
            }
            content.innerHTML = html;
        } else if (currentView.startsWith('category_')) {
            const catId = currentView.replace('category_', '');
            const cat = categories.find(c => c.id === catId);
            const filteredDishes = dishes.filter(d => String(d.category) === String(catId));

            let html = bannerHtml;
            html += `<h2>${cat ? cat.name : 'Catégorie'}</h2>`;
            html += `<button class="btn-action" style="margin-bottom:15px; width:auto;" onclick="goHome()">← Retour</button>`;
            
            if (filteredDishes.length === 0) {
                html += `<p style="text-align:center; margin-top:20px;">Aucun plat dans cette catégorie.</p>`;
            } else {
                html += '<div class="grid-container">';
                filteredDishes.forEach(dish => {
                    const cardColor = dish.color || '#ffffff';
                    const textColor = getContrastColor(cardColor);
                    html += `<div class="item-card" style="background-color: ${cardColor}; color: ${textColor};" 
                        onclick="handleElementClick('dish', '${dish.id}')" 
                        ondblclick="handleElementDoubleClick('dish', '${dish.id}')">
                        <div><strong>${dish.name}</strong></div>
                        <div style="margin-top: 5px; font-size: 0.9em;">${dish.price} €</div>
                    </div>`;
                });
                html += '</div>';
            }
            content.innerHTML = html;
        } else if (currentView === 'addition') {
            let html = bannerHtml;
            html += `<h2>Addition</h2>`;
            html += `<button class="btn-action" style="margin-bottom:15px; width:auto;" onclick="goHome()">← Retour au menu</button>`;
            
            let total = 0;
            if (order.length === 0) {
                html += `<p style="text-align:center; margin-top:20px;">Aucune commande en cours.</p>`;
            } else {
                html += '<div class="grid-container">';
                order.forEach(item => {
                    total += parseFloat(item.price);
                    const cardColor = item.color || '#ffffff';
                    const textColor = getContrastColor(cardColor);
                    html += `<div class="item-card selected" style="background-color: ${cardColor}; color: ${textColor};" 
                        onclick="handleElementClick('order_item', '${item.id}')">
                        <div><strong>${item.name}</strong></div>
                        <div style="margin-top: 5px; font-size: 0.9em;">(Cliquer pour retirer)</div>
                        <div style="margin-top: 5px; font-size: 0.9em;">${item.price} €</div>
                    </div>`;
                });
                html += '</div>';
            }
            
            html += `<div class="addition-total">
                PRIX : <span>${total.toFixed(2)} €</span>
            </div>`;
            
            if(order.length > 0) {
                html += `<button class="btn-action" style="margin-top:15px; background-color:#2ecc71;" onclick="finalizeOrder()">Finaliser la commande</button>`;
            }
            
            content.innerHTML = html;
        }
    }

    function updateCategorySelect() {
        const select = document.getElementById('newDishCategory');
        if (!select) return;
        const currentSelected = select.value;
        select.innerHTML = '';
        categories.forEach(cat => {
            select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
        });
        if (currentSelected) {
            select.value = currentSelected;
        }
    }

    function openCategory(catId) {
        currentView = 'category_' + catId;
        render();
    }

    function showAddition() {
        currentView = 'addition';
        render();
    }

    function goHome() {
        currentView = 'home';
        render();
    }

    function finalizeOrder() {
        order = [];
        saveData();
        currentView = 'home';
        render();
    }

    function toggleOverlay() {
        const menu = document.getElementById('overlayMenu');
        const backdrop = document.getElementById('overlayBackdrop');
        menu.classList.toggle('open');
        backdrop.classList.toggle('open');
    }

    function addCategory() {
        const nameInput = document.getElementById('newCatName');
        const colorInput = document.getElementById('newCatColor');
        const name = nameInput.value.trim();
        const color = colorInput.value;
        
        if (name) {
            const id = 'cat_' + Date.now();
            categories.push({ id, name, color });
            nameInput.value = '';
            saveData();
            render();
            toggleOverlay();
        } else {
            alert('Veuillez entrer un nom de catégorie.');
        }
    }

    function addDish() {
        const nameInput = document.getElementById('newDishName');
        const priceInput = document.getElementById('newDishPrice');
        const colorInput = document.getElementById('newDishColor');
        const categorySelect = document.getElementById('newDishCategory');

        const name = nameInput.value.trim();
        const price = priceInput.value;
        const color = colorInput.value;
        const category = categorySelect.value;

        if (name && price && category) {
            const id = 'dish_' + Date.now();
            dishes.push({ id, name, price, color, category });
            nameInput.value = '';
            priceInput.value = '';
            saveData();
            render();
            toggleOverlay();
        } else {
            alert('Veuillez remplir tous les champs et vous assurer qu\'une catégorie est sélectionnée.');
        }
    }

    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function changeFontSize() {
        const html = document.documentElement;
        const current = html.getAttribute('data-font-size');
        let next = 'medium';
        if (current === 'small') next = 'medium';
        else if (current === 'medium') next = 'large';
        else if (current === 'large') next = 'small';
        html.setAttribute('data-font-size', next);
    }

    render();
</script>
</body>
</html>
